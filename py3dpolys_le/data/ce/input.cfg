[3dpolys_le]
# default 3dpolys_le parameters' values
# polymer characteristics
Nchain = 8860
L = 16
# not used yet: kint = 1.17
Ea = 0.
init_mode = z

# measurements
Niter = 250
Nmeas = 3
Ninter = 840000
burnin = 0
burnout = 0
burnoutM = 0

# Loop-Extrusion factors
kb = 2.8e-6
ku = 2e-6
km = 2.7e-3
Nlef = 200
# optional lef_binding_sites.csv: name,midpoint,impermeability,score,b-position,strand
lef_binding_sites = py3dpolys_le/data/ce/lef_binding_sites_rex_Crane2015.csv
# optional boundaries.csv: name,midpoint,impermeability,score,b-position,strand
boundary = py3dpolys_le/data/ce/mex-sites.csv
boundary_factor = 1.
boundary_score = 1.
boundary_direction = 0
z_loop = true
unidirectional = false

# analysis: experiments in silico:
# 1.42 = 100nm
radius_contact = 2.84

# batch job run prefix
[job_runner]
# Slurm
cmd_prefix         =sbatch --job-name=3dpolys_le --time=1-00:00:00 --mem-per-cpu=8G --nodes=1 --ntasks-per-node=1 --cpus-per-task=8 {cmd_job_dependency}
cmd_prefix_sim     =sbatch --job-name=3dpolys_le --time=3-00:00:00 --mem-per-cpu=6G --nodes=1 --ntasks-per-node=50 --cpus-per-task=1 {cmd_job_dependency}
cmd_prefix_analysis=sbatch --job-name=3dpolys_le --time=3-00:00:00 --mem-per-cpu=16G --nodes=1 --ntasks-per-node=1 --cpus-per-task=4 {cmd_job_dependency}
cmd_prefix_stats   =sbatch --job-name=3dpolys_le --time=3-00:00:00 --mem-per-cpu=16G --nodes=1 --ntasks-per-node=1 --cpus-per-task=4 {cmd_job_dependency}
jobid_re=\d+$
cmd_job_dependency=--dependency=afterany:{jobid}

# shell
#cmd_prefix={cmd_job_dependency}
#jobid_re=
#cmd_job_dependency={jobid}

