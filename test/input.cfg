[3dpolys_le]
# default 3dpolys_le parameters' values
# polymer characteristics
Nchain = 8860
L = 16
# not used yet: kint = 1.17
Ea = 0.
init_mode = z

# measurements
Niter = 8
Nmeas = 3
Ninter = 240000
burnin = 0
burnout = 0
burnoutM = 0

# Loop-Extrusion factors
kb = 2.8e-6
ku = 2e-6
km = 2.7e-3
Nlef = 200
# optional lef_binding_sites.csv: name,midpoint,impermeability,score,b-position,strand
lef_binding_sites = /Users/todor/unibe/git/3DPolyS-LE/binding-sites_rex_Crane2015.csv
# optional boundaries.csv: name,midpoint,impermeability,score,b-position,strand
#boundary = /Users/todor/unibe/git/3DPolyS-LE/test/sip_loopanchor_boundaries.csv
boundary_factor = 1.
boundary_score = 1.
boundary_direction = 0
z_loop = true
unidirectional = false

# analysis: experiments in silico:
# 1.42 = 100nm
radius_contact = 2.84

[job_runner]
# batch job run prefix
# shell
cmd_prefix=echo {cmd_job_dependency}
cmd_prefix_sim=echo sim {cmd_job_dependency}
cmd_prefix_analysis=echo analysis {cmd_job_dependency}
cmd_prefix_stats=echo stats {cmd_job_dependency}
jobid_re=
cmd_job_dependency={jobid}

# Slurm
#cmd_prefix="sbatch {cmd_job_dependency} "
#jobid_re="\d+$"
#cmd_job_dependency="--dependency=afterany:{jobid} "

