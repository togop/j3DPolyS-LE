[3dpolys_le]
# default 3dpolys_le parameters' values
# polymer characteristics
Nchain = 3000
L = 11
# not used yet: kint = 1.17
Ea = 0.
init_mode = z

# measurements
Niter = 6
Nmeas = 3
Ninter = 120000
burnin = 0
burnout = 0
burnoutM = 0

# Loop-Extrusion factors
kb = 2.8e-6
ku = 2e-6
km = 2.7e-3
Nlef = 50
# optional lef_binding_sites.csv: name,midpoint,impermeability,score,b-position,strand
#lef_binding_sites = /mnt/external.data/ttgitchev/3dpolys_le_sims/input_data/loading_sites/loading_sites_strong_loops_382.csv
#basal_loading_factor = 0.5
# optional boundaries.csv: name,midpoint,impermeability,score,b-position,strand
boundary = test/data/boundaries_demo_3000.csv
boundary_direction = 0
z_loop = false
unidirectional = false

# analysis: experiments in silico:
# 1.42 = 100nm
radius_contact = 2.86

# hic-chi2-min:
cmp_chrs=chr1
#exp_cool=/mnt/external.data/ttgitchev/published/366_4_2000.cool
#exp_cool=/mnt/external.data/ttgitchev/published/wt_N2_Moushumi2020_HIC1_5000.cool
#exp_cool=./test/data/wt_N2_Moushumi2020_HIC1_5000.cool
#tads_boundary=
# tads_boundary=/mnt/imaging.data/ttgitchev/3dpolys_le_sims/input_data/tad_boundaries/N2.chrX.allValidPairs.hic.5-10kbLoops.bed


# batch job run prefix
[job_runner]
# Slurm
cmd_run=shell
jobid_re=\d+$
cmd_job_dependency=--dependency=afterany:{jobid}
cmd_prefix=sbatch --job-name=3dpolys_le --time=16:00:00 --mem-per-cpu=8G --nodes=1 --ntasks-per-node=1 --cpus-per-task=8 --mail-user=todor.gitchev@izb.unibe.ch --mail-type=end {cmd_job_dependency}
#cmd_in=stdout
#cmd_in=file:{cmd_in_file}
container_prefix=

[job_runner_sim]
# Slurm
cmd_prefix=sbatch --job-name=3dpolys_sim --time=23:00:00 --mem-per-cpu=4G --nodes=1 --ntasks-per-node=50 --cpus-per-task=1 --mail-user=todor.gitchev@izb.unibe.ch --mail-type=end {cmd_job_dependency}

[job_runner_analysis]
# Slurm
cmd_prefix=sbatch --job-name=3dpolys_analysis --time=16:00:00 --mem-per-cpu=16G --nodes=1 --ntasks-per-node=1 --cpus-per-task=4 --mail-user=todor.gitchev@izb.unibe.ch --mail-type=end {cmd_job_dependency}

[job_runner_stats]
# Slurm
cmd_prefix=sbatch --job-name=3dpolys_stats --time=16:00:00 --mem-per-cpu=16G --nodes=1 --ntasks-per-node=1 --cpus-per-task=4 --mail-user=todor.gitchev@izb.unibe.ch --mail-type=end {cmd_job_dependency}
plot_format=png
#plot_cmap=hot_r
plot_cmap=Greys

# shell
#cmd_prefix={cmd_job_dependency}
#jobid_re=
#cmd_job_dependency={jobid}

# LSF need to be testet
#cmd_prefix="bsub {cmd_job_dependency} "
#jobid_re="\d+$"
#cmd_job_dependency="-w done({jobid})"
