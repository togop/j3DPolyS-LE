singularity:
  stage: production
  #image: quay.io/singularity/singularity:v3.7.3
  needs: [test]
  trigger:
    include: .singularity-ci.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  resource_group: production
