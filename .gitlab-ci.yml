#  gitlab-runner register
# https://gitlab.com/togop/3DPolyS-LE
# locally run it with:  gitlab-runner exec docker test
# how to test locally: https://medium.com/@umutuluer/how-to-test-gitlab-ci-locally-f9e6cef4f054
image:
  togop/gcc_gfortran_mpi_hdf5_python:latest

before_script:
  - echo "PATH=$PATH:/root/miniconda3/bin/" >> ~/.bashrc
  - source ~/.bashrc
  - conda init bash
  - source ~/.bashrc
  - make env
  - conda activate py3dpolys_le
  - make all
  - echo "conda activate py3dpolys_le" >> ~/.bashrc
  #- cat ~/.bashrc
  - source ~/.bashrc

test:
  script:
    - pwd
    #- cd bin
    - ls -la
    - 3dpolys_le_runner --help
    - python --version
    - echo 'Start tests ...'
    - 3dpolys_le_runner run -o ./out-8860 -i ./test/test_shell_input.cfg --cmd_run_file ./run_test_shell_input.sh
    - ls -la
    - ./test/test_cmp.sh ./run_test_shell_input.sh ./test/expected/run_test_shell_input.sh
    - chmod +x ./run_test_shell_input.sh
    - ./run_test_shell_input.sh
    - ./test/test.sh ./out-8860/config.out
    - ./test/test.sh ./out-8860/contact-decay_wt_N2_Moushumi2020_HIC1_5000_6_vs_X__hic_002.h5_chi2_lin.10000.svg
    - ./test/test.sh ./out-8860/contact-decay_wt_N2_Moushumi2020_HIC1_5000_6_vs_X__hic_002.h5_chi2_log.10000.svg
    - ls -la ./out-8860
    - ls -la ./out-8860/r2.84
    - ./test/test.sh ./out-8860/3dpoys_le.cfg
    - ./test/test.sh ./out-8860/r2.84/Chip.out
    - ./test/test.sh ./out-8860/r2.84/xyzconfig.out
    - ./test/test.sh ./out-8860/r2.84/hic_001.hdf5
    - ./test/test.sh ./out-8860/r2.84/hic_002.hdf5
    - ./test/test.sh ./out-8860/r2.84/hic_001_hot_r.png
    - ./test/test.sh ./out-8860/r2.84/hic_002_hot_r.png
    - ./test/test.sh ./out-8860/r2.84/hic_002.hdf5.10000_decay_probs_lin.txt
    - ./test/test.sh ./out-8860/r2.84/hic_002.hdf5.10000_decay_probs_log.txt
    # test 2
    - 3dpolys_le_runner run -i ./test/test_no_tads_shell_input.cfg --cmd_run_file ./run_test_no_tads_shell_input.sh
    - ./test/test_cmp.sh ./run_test_no_tads_shell_input.sh ./test/expected/run_test_no_tads_shell_input.sh
    - chmod +x ./run_test_no_tads_shell_input.sh
    - ./run_test_no_tads_shell_input.sh
    - ls -la
    - ls -la out-Nlef200-km0.0027-bd0-bf1-bs_im-z_z-loop
    - ls -la out-Nlef200-km0.0027-bd0-bf1-bs_im-z_z-loop/r2.84
    # test 3
    - 3dpolys_le_runner run -o out/test3 --km 0.0017 --nlef 100 -bd 1 -z -u -im h -lr 3.55 7.1 -i ./test/test_tads_shell_input.cfg --cmd_run_file ./run_test_tads_shell_input.sh
    - ./test/test_cmp.sh ./run_test_tads_shell_input.sh ./test/expected/run_test_tads_shell_input.sh
    - chmod +x ./run_test_tads_shell_input.sh
    - ./run_test_tads_shell_input.sh
    - ls -la .
    - ls -la out/test3
    - ls -la out/test3/r3.55
    - ls -la out/test3/r7.10
