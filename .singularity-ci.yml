image:
  name: quay.io/singularity/singularity:v3.7.3
  entrypoint: [""]

stages:
  - build
  - deploy

# Build Singularity container
singularity-image:
  stage: build
  script:
    - singularity build py3dpolys_le.sif Singularity
  artifacts:
    paths:
      - py3dpolys_le.sif

# Push the image on the registry
deploy:
  stage: deploy
  script:
    - mkdir ~/.singularity
    - echo "$SYLABS_TOKEN"
    #- echo "$SYLABS_TOKEN_VAR" > ~/.singularity/sylabs-token
    - cat "$SYLABS_TOKEN" > ~/.singularity/sylabs-token
    #- cat ~/.singularity/sylabs-token
    #- singularity push --docker-username "${CI_REGISTRY_USER}" --docker-password "${CI_REGISTRY_PASSWORD}" py3dpolys_le.sif oras://"$CI_REGISTRY_IMAGE"/"$CI_PROJECT_NAME":"$CI_COMMIT_TAG"
    - singularity remote login SylabsCloud < ~/.singularity/sylabs-token
    - singularity push -U py3dpolys_le.sif library://todor/default/py3dpolys_le:latest
